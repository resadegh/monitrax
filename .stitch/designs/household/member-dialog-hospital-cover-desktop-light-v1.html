<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Household Member Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-bright": "#f4fcf0",
                      "trail-indigo": "#6366F1",
                      "trail-emerald": "#16A34A",
                      "on-primary-fixed": "#002109",
                      "secondary-fixed": "#dce2f6",
                      "on-tertiary-fixed-variant": "#38485d",
                      "inverse-on-surface": "#ecf3e7",
                      "outline-slate": "#94A3B8",
                      "on-secondary": "#ffffff",
                      "on-tertiary-fixed": "#0b1c30",
                      "surface-tint": "#006e2d",
                      "on-primary": "#ffffff",
                      "secondary-fixed-dim": "#c0c6da",
                      "secondary-container": "#d9dff4",
                      "on-background": "#171d16",
                      "surface-variant": "#dde5d9",
                      "surface-container-low": "#eff6ea",
                      "error-red": "#DC2626",
                      "tertiary": "#4d5d73",
                      "on-primary-fixed-variant": "#005320",
                      "primary-fixed-dim": "#62df7d",
                      "on-primary-container": "#f7fff2",
                      "on-surface": "#171d16",
                      "trail-amber": "#F59E0B",
                      "surface-container-highest": "#dde5d9",
                      "inverse-primary": "#62df7d",
                      "error": "#ba1a1a",
                      "tertiary-container": "#66768d",
                      "tertiary-fixed": "#d3e4fe",
                      "surface-ivory": "#FAFAF7",
                      "on-surface-variant": "#3e4a3d",
                      "tertiary-fixed-dim": "#b7c8e1",
                      "secondary": "#585e6f",
                      "error-container": "#ffdad6",
                      "surface": "#f4fcf0",
                      "trail-sky": "#0EA5E9",
                      "surface-container-high": "#e3eadf",
                      "surface-dim": "#d5dcd1",
                      "on-secondary-fixed-variant": "#404757",
                      "outline": "#6e7b6c",
                      "on-error": "#ffffff",
                      "trail-violet": "#8B5CF6",
                      "primary-container": "#00873a",
                      "background": "#f4fcf0",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-container": "#fdfcff",
                      "inverse-surface": "#2b322b",
                      "surface-container": "#e9f0e5",
                      "on-secondary-container": "#5c6274",
                      "primary-fixed": "#7ffc97",
                      "on-error-container": "#93000a",
                      "on-secondary-fixed": "#151b2a",
                      "on-tertiary": "#ffffff",
                      "outline-variant": "#bdcaba",
                      "primary": "#006b2c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "20px",
                      "container-max": "1280px",
                      "unit": "4px",
                      "gutter": "24px",
                      "margin-desktop": "48px",
                      "section-gap": "48px"
              },
              "fontFamily": {
                      "headline-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "body-sm": ["Inter"],
                      "label-md": ["Inter"],
                      "eyebrow": ["Inter"],
                      "data-lg": ["Inter"],

                      "headline-lg": ["Inter"]

              "fontSize": {
                      "headline-sm": ["20px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                      "body-lg": ["18px", { "lineHeight": "1.65", "letterSpacing": "0", "fontWeight": "400" }],
                      "headline-lg-mobile": ["28px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                      "body-sm": ["14px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                      "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0", "fontWeight": "500" }],
                      "eyebrow": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.18em", "fontWeight": "500" }],
                      "data-lg": ["28px", { "lineHeight": "1.0", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                      "body-md": ["16px", { "lineHeight": "1.65", "letterSpacing": "0", "fontWeight": "400" }],
                      "data-xl": ["40px", { "lineHeight": "1.0", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                      "display-lg": ["48px", { "lineHeight": "1.05", "letterSpacing": "-0.03em", "fontWeight": "600" }],
                      "headline-md": ["24px", { "lineHeight": "1.05", "letterSpacing": "-0.03em", "fontWeight": "600" }],
                      "headline-lg": ["32px", { "lineHeight": "1.05", "letterSpacing": "-0.03em", "fontWeight": "600" }]
              }
            },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom modal radius */
        .rounded-modal { border-radius: 22px; }
        /* Ambient blur for overlay */
        .modal-overlay {
            background-color: rgba(250, 250, 247, 0.95);
            backdrop-filter: blur(8px);
        }
        /* Soft layered float shadow */
        .modal-shadow {
            box-shadow: 0 4px 6px -1px rgba(11, 18, 32, 0.04), 0 20px 25px -5px rgba(11, 18, 32, 0.08);
        }
        /* Gradient strip */
        .gradient-strip {
            background: linear-gradient(90deg, #0EA5E9 0%, #6366F1 100%);
        }
        /* Segmented control transition */
        .segment-pill { transition: all 0.2s ease-in-out; }
      </style>
</head>
<body class="h-full w-full flex items-center justify-center font-sans modal-overlay text-on-surface antialiased selection:bg-trail-emerald/20">
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative w-full max-w-[520px] bg-surface-container-lowest rounded-modal border border-outline-slate/20 modal-shadow overflow-hidden flex flex-col mx-gutter" role="dialog">
<!-- Top Gradient Strip -->
<div class="h-[3px] w-full gradient-strip absolute top-0 left-0"></div>
<!-- Header -->
<div class="px-gutter pt-8 pb-6 flex items-start justify-between">
<div class="flex flex-col gap-1">
<span class="font-eyebrow text-eyebrow text-secondary uppercase tracking-widest">MY HOUSEHOLD</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface" id="modal-title">Edit member</h2>
<p class="font-body-sm text-body-sm text-secondary">Newsha · Spouse</p>
</div>
<button aria-label="Close dialog" class="p-2 text-outline-slate hover:text-on-surface transition-colors rounded-full focus:outline-none focus:ring-2 focus:ring-trail-emerald/50 flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Form Content -->
<div class="px-gutter pb-8 flex flex-col gap-6">
<!-- Field 1: Name -->
<div class="flex flex-col gap-2">
<label class="font-eyebrow text-eyebrow text-secondary uppercase tracking-widest" for="member-name">NAME</label>
<input class="w-full h-12 px-4 rounded-xl border-[1.5px] border-outline-slate/30 bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-trail-emerald focus:ring-0 outline-none transition-colors" id="member-name" placeholder="Enter name" type="text" value="Newsha"/>
</div>
<!-- Field 2: Relationship -->
<div class="flex flex-col gap-2">
<label class="font-eyebrow text-eyebrow text-secondary uppercase tracking-widest" for="member-relationship">RELATIONSHIP</label>
<div class="relative">
<select class="w-full h-12 px-4 appearance-none rounded-xl border-[1.5px] border-outline-slate/30 bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-trail-emerald focus:ring-0 outline-none transition-colors cursor-pointer" id="member-relationship">
<option selected="" value="Spouse">Spouse</option>
<option value="Partner">Partner</option>
<option value="Child">Child</option>
<option value="Dependent">Dependent</option>
<option value="Other">Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-outline-slate">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Field 3: Date of Birth -->
<div class="flex flex-col gap-2">
<label class="font-eyebrow text-eyebrow text-secondary uppercase tracking-widest" for="member-dob">DATE OF BIRTH</label>
<div class="relative">
<input class="w-full h-12 pl-4 pr-10 rounded-xl border-[1.5px] border-outline-slate/30 bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder-outline-slate focus:border-trail-emerald focus:ring-0 outline-none transition-colors" id="member-dob" placeholder="Optional" type="text"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-outline-slate">
<span class="material-symbols-outlined text-[20px]">calendar_today</span>
</div>
</div>
</div>
<!-- Field 4: Earns Income Toggle -->
<div class="flex items-center justify-between pt-2">
<div class="flex flex-col pr-4">
<span class="font-label-md text-label-md text-on-surface">Earns income?</span>
<span class="font-body-sm text-body-sm text-secondary mt-1">Used to split tax positions per person</span>
</div>
<!-- Toggle Switch (ON) -->
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-trail-emerald focus:ring-offset-2 bg-trail-emerald" role="switch" type="button">
<span class="translate-x-5 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
<!-- Field 5: Private Hospital Cover -->
<div class="flex flex-col gap-3 pt-2">
<label class="font-eyebrow text-eyebrow text-secondary uppercase tracking-widest">PRIVATE HOSPITAL COVER?</label>
<!-- Segmented Control -->
<div class="flex p-1 bg-surface-container-low rounded-xl border border-outline-slate/10 h-[44px]">
<button class="segment-pill flex-1 flex items-center justify-center font-label-md text-label-md text-secondary hover:text-on-surface rounded-lg">Yes</button>
<button class="segment-pill flex-1 flex items-center justify-center font-label-md text-label-md text-secondary hover:text-on-surface rounded-lg">No</button>
<button class="segment-pill flex-1 flex items-center justify-center font-label-md text-label-md text-on-surface bg-surface-container-lowest shadow-[0_1px_2px_rgba(11,18,32,0.05)] border border-outline-slate/10 rounded-lg">Not sure</button>
</div>
<!-- Helper Alert -->
<div class="flex items-start gap-2 mt-1">
<span class="material-symbols-outlined text-[16px] text-trail-sky mt-[2px]">info</span>
<p class="font-body-sm text-body-sm text-secondary leading-snug">Affects the Medicare levy surcharge. If you're not sure, we assume no cover — you can update this any time.</p>
</div>
</div>
</div>
<!-- Footer -->
<div class="border-t-[1.5px] border-surface-container px-gutter py-5 flex items-center justify-end gap-4 bg-surface-container-lowest">
<button class="font-label-md text-label-md text-secondary hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-outline-slate/30 rounded-lg px-4 py-2">
                Cancel
            </button>
<button class="font-label-md text-label-md text-on-primary bg-trail-emerald hover:bg-trail-emerald/90 transition-colors h-11 px-6 rounded-xl shadow-[0_2px_4px_rgba(22,163,74,0.15)] focus:outline-none focus:ring-2 focus:ring-trail-emerald focus:ring-offset-2 flex items-center justify-center">
                Save member
            </button>
</div>
</div>
</body></html>
