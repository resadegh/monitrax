<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Review Transactions - Dark Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {

                        "on-secondary-fixed-variant": "#2f2ebe",
                        "on-error": "#ffffff",
                        "tertiary-container": "#9b9c9a",
                        "on-tertiary-container": "#323432",
                        "on-secondary-fixed": "#07006c",
                        "surface-tint": "#006591",
                        "error-container": "#ffdad6",
                        "entity-rental": "#14B8A6",
                        "surface-container-lowest": "#ffffff",
                        "growth": "#16A34A",
                        "tertiary": "#5d5f5d",
                        "tertiary-fixed-dim": "#c6c7c4",
                        "error": "#DC2626",
                        "surface-bright": "#FFFFFF",
                        "primary-fixed-dim": "#89ceff",
                        "on-secondary-container": "#fffbff",
                        "on-primary-container": "#003751",
                        "secondary-fixed-dim": "#c0c1ff",
                        "surface-container-high": "#e2e8fc",
                        "secondary-container": "#6063ee",
                        "surface-dim": "#d3daee",
                        "entity-home": "#F59E0B",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#454745",
                        "inverse-surface": "#2a3040",
                        "inverse-on-surface": "#edf0ff",
                        "outline-variant": "#bec8d2",
                        "surface-container-highest": "#dce2f6",
                        "card-glass-light": "rgba(255, 255, 255, 0.70)",
                        "on-surface": "#151b2a",
                        "background": "#f9f9ff",
                        "primary-fixed": "#c9e6ff",
                        "on-surface-variant": "#3e4850",
                        "growth-lift": "#22C55E",
                        "primary-container": "#0ea5e9",
                        "on-primary-fixed-variant": "#004c6e",
                        "surface": "#f9f9ff",
                        "secondary": "#4648d4",
                        "surface-variant": "#dce2f6",

                        "on-primary-fixed": "#001e2f",
                        "outline": "#6e7881",
                        "trail-live": "#8B5CF6",
                        "inverse-primary": "#89ceff",
                        "on-error-container": "#93000a",
                        "slate": {
                            400: "#94A3B8"
                        }
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "screen-margin": "20px",
                        "card-padding": "16px",
                        "section-gap": "20px",
                        "tab-bar-height": "56px",
                        "hero-padding": "20px",
                        "touch-target": "44px"
                    },
                    fontFamily: {
                        "body-lg": ["Inter"],
                        "data-hero": ["Inter"],

                        "headline-lg": ["Inter"]

                    fontSize: {

                        "headline-lg": ["28px", { "lineHeight": "31px", "letterSpacing": "-0.02em", "fontWeight": "600" }]

<style>
        body { font-family: 'Inter', sans-serif; background-color: #050913; }
        .glass-panel {
            background-color: rgba(14, 20, 36, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .inner-highlight {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .front-card-shadow {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }
        .sky-indigo-gradient {
            background: linear-gradient(135deg, #0ea5e9, #6063ee);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-white h-screen overflow-hidden flex flex-col relative">
<!-- Top Bar -->
<header class="flex flex-col px-screen-margin pt-12 pb-4 shrink-0 z-10">
<div class="flex items-center justify-between mb-4">
<h1 class="font-headline-lg text-headline-lg text-white">Review</h1>
<span class="font-body-md text-body-md text-slate-400">3 of 12</span>
</div>
<!-- Progress Bar -->
<div class="h-1 bg-white/10 rounded-full w-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-primary-container to-secondary-container w-[25%] rounded-full"></div>
</div>
</header>
<!-- Main Content Area: Swipe Stack -->
<main class="flex-1 relative flex flex-col items-center justify-center px-screen-margin overflow-hidden z-10 w-full max-w-[400px] mx-auto">
<!-- Card 3 (Back) -->
<div class="absolute top-8 w-full max-w-[340px] h-[360px] rounded-[24px] bg-[#0E1424]/40 border border-white/5 blur-[1px] scale-90 translate-y-[-24px] z-0"></div>
<!-- Card 2 (Middle) -->
<div class="absolute top-10 w-full max-w-[350px] h-[360px] rounded-[24px] bg-[#0E1424]/65 border border-white/5 blur-[0.5px] scale-95 translate-y-[-12px] z-10"></div>
<!-- Front Card (Card 1) -->
<div class="relative w-full h-[400px] glass-panel rounded-[28px] front-card-shadow border border-white/5 z-20 flex flex-col overflow-hidden transition-transform duration-300 ease-out active:scale-[0.98]">
<!-- Edge Swipe Hints (Visual only, absolute positioned) -->
<!-- Left Swipe Hint (Amber/Flag) -->
<div class="absolute left-0 top-0 bottom-0 w-4 bg-gradient-to-r from-slate-400/20 to-transparent flex items-center justify-start pl-1 opacity-0 pointer-events-none">
<span class="material-symbols-outlined text-white text-opacity-50 text-sm">edit</span>
</div>
<!-- Right Swipe Hint (Emerald/Accept) -->
<div class="absolute right-0 top-0 bottom-0 w-4 bg-gradient-to-l from-growth-lift/20 to-transparent flex items-center justify-end pr-1 opacity-0 pointer-events-none">
<span class="material-symbols-outlined text-white text-opacity-50 text-sm">check</span>
</div>
<div class="flex-1 p-6 flex flex-col">
<!-- Header: Gem & Merchant -->
<div class="flex flex-col items-center mb-8 mt-4">
<div class="w-[56px] h-[56px] rounded-[18px] sky-indigo-gradient flex items-center justify-center mb-4 inner-highlight shadow-lg">
<span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
</div>
<h2 class="font-headline-md text-headline-md text-[#FAFAF7] text-center">Cincotta Merrylands</h2>
<p class="font-body-md text-body-md text-slate-400 text-center mt-1">25 May 2026 · Everyday account</p>
</div>
<!-- Amount -->
<div class="flex flex-col items-center justify-center mb-10 flex-1">
<div class="font-data-hero text-data-hero text-[#FAFAF7] tracking-tight tabular-nums">-$65.00</div>
</div>
<!-- Suggested Category Block -->
<div class="mt-auto bg-primary-container/10 border border-primary-container/20 rounded-2xl p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-growth-lift"></div>
<div class="flex flex-col">
<span class="font-eyebrow text-eyebrow text-primary-container uppercase">Suggested Category</span>
<span class="font-body-md text-body-md text-white font-medium">Groceries</span>
</div>
</div>
<button class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/10 hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-400 text-sm">edit</span>
</button>
</div>
</div>
</div>
</main>
<!-- Action Row (Bottom Safe Area) -->
<div class="pb-8 pt-4 px-screen-margin flex flex-col items-center shrink-0 z-20 w-full max-w-[400px] mx-auto gap-6">
<div class="flex items-center justify-center gap-4 w-full px-4">
<!-- Recategorise Button (Left) -->
<button class="w-[56px] h-[56px] rounded-full bg-[#0E1424] border border-white/10 flex items-center justify-center shadow-lg active:scale-95 transition-all flex-shrink-0">
<span class="material-symbols-outlined text-white">edit</span>
</button>
<!-- Confirm Button (Right) -->
<button class="flex-1 h-[56px] rounded-full bg-growth-lift flex items-center justify-center shadow-[0_8px_16px_rgba(34,197,94,0.2)] active:scale-95 transition-all inner-highlight gap-2">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'wght' 600;">check</span>
<span class="font-body-lg text-body-lg text-white font-medium">Confirm</span>
</button>
</div>
<!-- Skip Link -->
<button class="font-body-md text-body-md text-slate-400 hover:text-white transition-colors py-2 px-4">
            Skip for now
        </button>
</div>
<!-- Atmospheric background halo -->
<div class="absolute inset-0 bg-gradient-to-b from-primary-container/5 to-transparent pointer-events-none -z-10"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary-container/10 rounded-full blur-[100px] pointer-events-none -z-10"></div>
</body></html>
