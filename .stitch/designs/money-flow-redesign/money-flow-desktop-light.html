<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAF7; /* Ivory background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 28px;
            box-shadow: 
                0 1px 2px rgba(15, 23, 42, 0.04), 
                0 8px 30px rgba(15, 23, 42, 0.06);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 900px;
        }

        /* Top accent gradient strip */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #16A34A 0%, #0EA5E9 50%, #8B5CF6 100%);
            z-index: 10;
        }

        /* Inner top white highlight */
        .glass-card::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>

<!-- Glass Card Container -->
<div class="glass-card flex flex-col p-8 md:p-10">

<div class="flex justify-between items-start mb-10 relative z-20">

<span class="font-label-md text-label-md text-on-surface-variant">View flow detail</span>
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">chevron_right</span>
</button>
</div>
<!-- Body (2 Columns) -->

<!-- LEFT: Donut Chart (Simulated with SVG) -->
<div class="w-full md:w-[45%] flex justify-center relative">
<!-- Donut SVG -->
<svg class="w-64 h-64 md:w-72 md:h-72 transform -rotate-90" viewbox="0 0 200 200">
<!-- Base ring (optional, for debugging/structure) -->
<!-- <circle cx="100" cy="100" r="80" fill="none" stroke="#f1efe8" stroke-width="30" /> -->
<!-- 
                        Circumference of r=80 is 2 * pi * 80 ≈ 502.65
                        Gaps: Let's use a 4px gap per segment. 5 segments = 20px total gap.
                        Remaining dash space = 502.65 - 20 = 482.65
                        
                        Segments:
                        Loans (44%): 0.44 * 482.65 = 212.36
                        Essentials (25%): 0.25 * 482.65 = 120.66
                        Tax (14%): 0.14 * 482.65 = 67.57
                        Surplus (12%): 0.12 * 482.65 = 57.91
                        Discretionary (5%): 0.05 * 482.65 = 24.13
                    -->
<!-- Loans (Sky - #0EA5E9) -->
<!-- offset: 0 -->
<circle cx="100" cy="100" fill="none" r="80" stroke="#0EA5E9" stroke-dasharray="212.36 290.29" stroke-dashoffset="0" stroke-linecap="round" stroke-width="30"></circle>
<!-- Essentials (Amber - #F59E0B) -->
<!-- offset: - (212.36 + 4 gap) = -216.36 -->
<circle cx="100" cy="100" fill="none" r="80" stroke="#F59E0B" stroke-dasharray="120.66 381.99" stroke-dashoffset="-216.36" stroke-linecap="round" stroke-width="30"></circle>
<!-- Tax (Rose - #E11D48) -->
<!-- offset: - (216.36 + 120.66 + 4 gap) = -341.02 -->
<circle cx="100" cy="100" fill="none" r="80" stroke="#E11D48" stroke-dasharray="67.57 435.08" stroke-dashoffset="-341.02" stroke-linecap="round" stroke-width="30"></circle>
<!-- Surplus (Emerald - #16A34A) - Thicker & Glowing -->
<!-- offset: - (341.02 + 67.57 + 4 gap) = -412.59 -->
<filter id="glow">
<fegaussianblur result="coloredBlur" stddeviation="3"></fegaussianblur>
<femerge>
<femergenode in="coloredBlur"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
<circle cx="100" cy="100" fill="none" filter="url(#glow)" r="80" stroke="#16A34A" stroke-dasharray="57.91 444.74" stroke-dashoffset="-412.59" stroke-linecap="round" stroke-width="34"></circle>
<!-- Discretionary (Violet - #8B5CF6) -->
<!-- offset: - (412.59 + 57.91 + 4 gap) = -474.5 -->
<circle cx="100" cy="100" fill="none" r="80" stroke="#8B5CF6" stroke-dasharray="24.13 478.52" stroke-dashoffset="-474.5" stroke-linecap="round" stroke-width="30"></circle>
</svg>

<div class="absolute inset-0 flex flex-col items-center justify-center transform translate-y-1">

</div>
</div>

</div>

<span class="font-body-md text-body-md tabular-nums text-on-surface font-medium">$17,000</span>
<span class="font-body-md text-body-md tabular-nums text-on-surface-variant w-10 text-right">5%</span>
</div>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="mt-10 pt-6 border-t border-outline-variant/20 text-center relative z-20">
<p class="font-body-sm text-[15px] text-on-surface-variant/80">You keep 12% of what you earn — every dollar of surplus is future freedom.</p>
</div>
</div>
</body></html>
