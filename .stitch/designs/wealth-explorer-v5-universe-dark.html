<style>
        body {
            background: radial-gradient(circle at 50% 50%, #0A0E1F 0%, #060914 60%, #050810 100%);
            overflow: hidden; /* Canvas should not scroll */
        }
        
        /* Particle Dust */
        .dust-motes {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.03) 1px, transparent 1px),
                radial-gradient(circle at 80% 40%, rgba(255,255,255,0.04) 1px, transparent 1px),
                radial-gradient(circle at 40% 70%, rgba(255,255,255,0.02) 2px, transparent 2px),
                radial-gradient(circle at 90% 90%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 150px 150px;
            opacity: 0.8;
            z-index: 0;
        }

        /* Spatial Elements Base */
        .canvas-container {
            position: absolute;
            top: 60px; /* Below Nav */
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            z-index: 10;
        }

        .squircle {
            position: absolute;
            background-color: rgba(19, 26, 46, 0.9);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            /* Transform origin center for scaling */
            transform-origin: center center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Specific Glows & Borders */
        .glow-emerald { box-shadow: inset 0 0 12px rgba(78, 222, 163, 0.15), 0 4px 30px rgba(0,0,0,0.3); border-bottom: 1px solid rgba(78, 222, 163, 0.3); border-right: 1px solid rgba(78, 222, 163, 0.3); }
        .glow-violet { box-shadow: inset 0 0 12px rgba(192, 193, 255, 0.15), 0 4px 30px rgba(0,0,0,0.3); border-bottom: 1px solid rgba(192, 193, 255, 0.3); border-right: 1px solid rgba(192, 193, 255, 0.3); }
        .glow-sky { box-shadow: inset 0 0 12px rgba(137, 206, 255, 0.15), 0 4px 30px rgba(0,0,0,0.3); border-bottom: 1px solid rgba(137, 206, 255, 0.3); border-right: 1px solid rgba(137, 206, 255, 0.3); }
        .glow-amber { box-shadow: inset 0 0 12px rgba(251, 191, 36, 0.15), 0 4px 30px rgba(0,0,0,0.3); border-bottom: 1px solid rgba(251, 191, 36, 0.3); border-right: 1px solid rgba(251, 191, 36, 0.3); }

        /* The Anchor Special Styling */
        .anchor-pulse {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(78, 222, 163, 0.4);
            animation: pulse-ring 4s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            pointer-events: none;
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Hover States Framework */
        .canvas-hover-active .squircle:not(.hovered):not(.neighbor) {
            opacity: 0.55;
            filter: blur(2px);
        }
        
        .squircle.hovered {
            transform: scale(1.6);
            z-index: 50;
        }
        
        .squircle.neighbor {
            transform: scale(1.2);
            z-index: 40;
        }

        /* Ribbon Base */
        svg.ribbons {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .ribbon-path {
            fill: none;
            stroke-width: 2;
            opacity: 0.2;
            transition: opacity 0.4s ease;
        }
        .ribbon-glow {
            fill: none;
            stroke-width: 8;
            filter: blur(4px);
            opacity: 0.1;
        }
        
        /* Active Ribbon */
        .ribbon-path.active {
            opacity: 0.8;
            stroke: #89ceff; /* Sky */
            stroke-dasharray: 10 5;
            animation: dash 20s linear infinite;
        }
        .ribbon-glow.active {
            stroke: #89ceff;
            opacity: 0.4;
        }
        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

        /* Top Nav Styling */
        .top-nav {
            background-color: rgba(10, 14, 25, 0.9);
            backdrop-filter: blur(24px);
        }
        
        .search-pill {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

            border: none;
        }
        .search-pill input:focus {
            outline: none;
            box-shadow: none;
        }

        .filter-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .filter-chip.active {
            background: rgba(192, 193, 255, 0.1);
            border-color: #c0c1ff;
            color: #c0c1ff;
        }
