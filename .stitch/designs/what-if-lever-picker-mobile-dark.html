<script>
        // Micro-interaction for cards
        document.querySelectorAll('button.glass-card').forEach(button => {
            button.addEventListener('click', () => {
                // Add a temporary subtle flash or ripple effect if desired
                button.classList.add('brightness-125');
                setTimeout(() => button.classList.remove('brightness-125'), 150);
            });
        });

        // Background Atmospheric Parallax Effect
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelectorAll('.absolute.opacity-\\[0\\.12\\], .absolute.opacity-\\[0\\.18\\]').forEach(icon => {
                icon.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
