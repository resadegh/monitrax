<style>
        body {
            background-color: #0A0A14;
            color: #e4e1f0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(22, 22, 30, 0.6);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        .emerald-glow {
            background: radial-gradient(circle at center, rgba(22, 163, 74, 0.08) 0%, rgba(10, 10, 20, 0) 70%);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 1000px;
            pointer-events: none;
            z-index: 0;
        }
        .input-surface {
            background-color: #16161E;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }
        .input-surface:focus {
            border-color: #16A34A;
            outline: none;
            box-shadow: 0 0 0 1px #16A34A;
        }
        .btn-emerald {
            background: linear-gradient(180deg, #16A34A 0%, #15803d 100%);
            box-shadow: 0 4px 14px 0 rgba(22, 163, 74, 0.3);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .btn-emerald:active {
            transform: scale(0.98);
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.2s ease;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.06);
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center relative">
<div class="emerald-glow"></div>
<main class="w-full max-w-[440px] px-6 py-12 relative z-10">
<!-- Brand Header -->
<header class="flex flex-col items-center mb-10">
<div class="flex items-center gap-3 mb-2">
<div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary font-bold" style="font-variation-settings: 'FILL' 1;">deployed_code</span>
</div>
<h1 class="font-headline-lg text-headline-lg font-bold tracking-tight text-white">Monitrax</h1>
</div>
<p class="font-body-md text-body-md text-white/50">Welcome back.</p>
</header>
<!-- Login Form -->
<section class="glass-panel rounded-2xl p-8 md:p-10">
<div class="mb-8">
<h2 class="font-headline-lg text-headline-lg text-white mb-2">Sign in to your account</h2>
<p class="font-label-md text-label-md">
<span class="text-white/50">Or</span>
<a class="text-primary hover:underline ml-1" href="#">create an account →</a>
</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-white/70 uppercase tracking-widest" for="email">Email Address</label>
<input class="w-full h-[48px] px-4 rounded-xl input-surface text-white font-body-md placeholder:text-white/20" id="email" placeholder="name@company.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-sm text-label-sm text-white/70 uppercase tracking-widest" for="password">Password</label>
</div>
<input class="w-full h-[48px] px-4 rounded-xl input-surface text-white font-body-md placeholder:text-white/20" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-white/20 bg-white/5 checked:bg-primary checked:border-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none text-[16px] font-bold">check</span>
</div>
<span class="font-label-md text-label-md text-white/50 group-hover:text-white transition-colors">Keep me signed in</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">Forgot password?</a>
</div>
<!-- Submit -->
<button class="w-full h-[48px] btn-emerald rounded-xl text-white font-label-md flex items-center justify-center gap-2" type="submit">
                    Sign in
                </button>
<!-- Divider -->
<div class="relative py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-white/10"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-[#16161E]/80 px-2 text-white/30 backdrop-blur-sm">Or continue with</span>
</div>
</div>
<!-- OAuth -->
<div class="grid grid-cols-2 gap-4">
<button class="h-[48px] btn-ghost rounded-xl flex items-center justify-center gap-2 font-label-md text-white" type="button">
<span class="material-symbols-outlined text-[20px]">google</span>
                        Google
                    </button>
<button class="h-[48px] btn-ghost rounded-xl flex items-center justify-center gap-2 font-label-md text-white" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">ios</span>
                        Apple
                    </button>
</div>
</form>
</section>
<!-- Footer -->
<footer class="mt-12 flex flex-col items-center gap-4">
<div class="flex items-center gap-6 font-label-sm text-label-sm text-white/40">
<a class="hover:text-white transition-colors" href="#">Terms of Service</a>
<a class="hover:text-white transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-white transition-colors" href="#">AFSL</a>
</div>
<p class="font-label-sm text-label-sm text-white/30">© 2024 Monitrax. All rights reserved.</p>
</footer>
</main>
<script>
        // Subtle micro-interaction for the radial glow
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.emerald-glow');
            const x = e.clientX;
            const y = e.clientY;
            
            // Gently move the glow towards the cursor but keep it centered-ish
            const moveX = (x - window.innerWidth / 2) * 0.05;
            const moveY = (y - window.innerHeight / 2) * 0.05;
            
            glow.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
        });
    </script>
</body></html>
