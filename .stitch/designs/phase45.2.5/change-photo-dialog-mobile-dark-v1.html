<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const sheet = document.querySelector('.bottom-sheet');
            const closeBtn = document.querySelector('[data-icon="close"]').parentElement;
            const cancelBtn = document.querySelectorAll('button')[2];

            const dismiss = () => {
                sheet.style.transform = 'translateY(100%)';
                setTimeout(() => {
                    // Logic to actually close/remove modal would go here
                }, 400);
            };

            closeBtn.addEventListener('click', dismiss);
            cancelBtn.addEventListener('click', dismiss);

            // Subtle parallax effect for handle drag (simulated)
            let startY = 0;
            sheet.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
            }, { passive: true });

            sheet.addEventListener('touchmove', (e) => {
                const delta = e.touches[0].clientY - startY;
                if (delta > 0) {
                    sheet.style.transform = `translateY(${delta}px)`;
                }
            }, { passive: true });

            sheet.addEventListener('touchend', (e) => {
                const delta = e.changedTouches[0].clientY - startY;
                if (delta > 100) {
                    dismiss();
                } else {
                    sheet.style.transform = 'translateY(0)';
                }
            }, { passive: true });
        });
    </script>
