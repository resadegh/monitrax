<!-- UI Interaction Script -->
<script>
        // Simple micro-interaction for the drop zone
        const dropZone = document.querySelector('.group');
        if (dropZone) {
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('bg-trail-sky/20');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('bg-trail-sky/20');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('bg-trail-sky/20');
                // Logic for handling file upload would go here
            });
        }
    </script>
