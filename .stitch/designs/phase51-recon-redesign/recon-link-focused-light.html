<!DOCTYPE html>

                      "surface-dim": "#d5dcd1",

                      "secondary-fixed-dim": "#c0c6da",

                      "inverse-surface": "#2b322b",

                      "trail-emerald": "#16A34A",
                      "on-background": "#171d16",
                      "on-tertiary-fixed-variant": "#38485d",

                      "error-red": "#DC2626",
                      "on-primary": "#ffffff",
                      "trail-amber": "#F59E0B",

              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",

              "spacing": {

                      "unit": "4px",

              "fontFamily": {

<body class="bg-surface-ivory min-h-screen flex items-center justify-center p-6">
<!-- Modal Container (460px width) -->
<main class="w-full max-w-[460px] bg-white/70 backdrop-blur-xl border border-on-surface/10 rounded-xl shadow-[0_1px_2px_rgba(15,23,42,0.04),0_8px_30px_rgba(15,23,42,0.06)] overflow-hidden relative">
<!-- Header -->
<header class="px-6 pt-6 pb-4 flex justify-between items-start">
<div>
<span class="text-trail-sky font-eyebrow text-eyebrow tracking-widest uppercase mb-1 block">LINK TRANSACTION</span>
<h1 class="font-headline-sm text-headline-sm text-[#0F172A]">We think we know what this is.</h1>
</div>
<button aria-label="Close" class="text-slate-400 hover:text-[#0F172A] transition-colors p-1">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</header>
<!-- Transaction Details Card -->
<section class="px-6 mb-6">
<div class="bg-white/50 border border-on-surface/5 rounded-xl p-6 flex flex-col items-center text-center">
<span class="text-slate-500 font-label-md text-label-md mb-2">18 Jun 2026</span>
<h2 class="font-headline-sm text-headline-sm text-[#0F172A] mb-4">Periodical Payment to Bankwest</h2>
<div class="mb-4">
<span class="font-data-xl text-data-xl tabular-nums text-[#0F172A]">-$1,295</span>
</div>
<div class="px-3 py-1 bg-surface-container-low text-on-surface-variant font-label-md text-label-md rounded-full border border-outline-variant/30">
                    Expense
                </div>
</div>
</section>
<!-- Recommended Matching Panel -->
<section class="px-6 mb-8">
<div class="bg-trail-emerald/[0.03] border border-trail-emerald rounded-xl p-5 relative">
<div class="absolute -top-3 left-4 bg-trail-emerald text-white px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase">
                    Recommended Match
                </div>
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-white rounded-lg border border-on-surface/5 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-trail-emerald text-[28px]" data-weight="fill">account_balance</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-[#0F172A] mb-1">Loan repayment — Bankwest</h3>
<div class="flex items-center gap-2">
<span class="text-slate-500 font-label-md text-label-md">Proof match detected:</span>
<div class="px-2 py-0.5 bg-trail-emerald/10 text-trail-emerald font-label-md text-[12px] rounded border border-trail-emerald/20 tabular-nums">
                                $1,295 interest (deductible)
                            </div>
</div>
</div>
</div>
</div>
</section>
<!-- Primary Action -->
<section class="px-6 mb-4">
<button class="brand-gradient w-full py-4 rounded-xl text-white font-label-md text-body-md font-semibold shadow-lg shadow-trail-indigo/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Confirm repayment
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
</section>
<!-- Footer Actions -->
<footer class="px-6 pb-8 text-center">
<div class="flex items-center justify-center gap-3 mb-6">
<span class="text-slate-500 font-label-md text-label-md">Remember payments like this</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-trail-emerald"></div>
</label>
</div>
<a class="text-slate-500 font-label-md text-label-md hover:text-[#0F172A] transition-colors underline underline-offset-4 decoration-slate-300" href="#">
                Skip for now
            </a>
</footer>
</main>
<!-- Visual Polish: Decorative elements -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-40">
<div class="absolute top-[10%] left-[5%] w-64 h-64 bg-trail-sky/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[10%] right-[5%] w-96 h-96 bg-trail-emerald/10 rounded-full blur-[150px]"></div>
</div>
<script>
        // Simple micro-interaction for the toggle
        document.querySelector('input[type="checkbox"]').addEventListener('change', function(e) {
            const label = this.parentElement.previousElementSibling;
            if (this.checked) {
                label.classList.remove('text-slate-400');
                label.classList.add('text-slate-500');
            } else {
                label.classList.add('text-slate-400');
                label.classList.remove('text-slate-500');
            }
        });
    </script>
</body></html>
