<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Monitrax - Add Property</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-container": "#1ca64d",
                        "primary": "#62df7d",
                        "inverse-on-surface": "#2b322b",
                        "on-primary-container": "#003111",
                        "on-surface-variant": "#bdcaba",
                        "error-container": "#93000a",
                        "secondary-container": "#00b55d",
                        "primary-fixed-dim": "#62df7d",
                        "surface-variant": "#30372f",
                        "tertiary-fixed": "#ffd9de",
                        "on-background": "#dde5d9",
                        "on-secondary": "#003919",
                        "on-tertiary-fixed-variant": "#8a143c",
                        "primary-fixed": "#7ffc97",
                        "outline": "#879485",
                        "inverse-primary": "#006e2d",
                        "on-secondary-container": "#003e1c",
                        "surface-container": "#1b211a",
                        "on-tertiary": "#660027",
                        "surface-dim": "#0e150f",
                        "outline-variant": "#3e4a3d",
                        "on-primary": "#003914",
                        "tertiary-container": "#ec6284",
                        "on-tertiary-container": "#5a0022",
                        "on-primary-fixed-variant": "#005320",
                        "surface-bright": "#343b33",
                        "secondary-fixed": "#6dfe9c",
                        "secondary": "#4de082",
                        "on-surface": "#dde5d9",
                        "on-primary-fixed": "#002109",
                        "inverse-surface": "#dde5d9",
                        "error": "#ffb4ab",
                        "surface-container-high": "#252c24",
                        "background": "#0e150f",
                        "surface-container-lowest": "#09100a",
                        "secondary-fixed-dim": "#4de082",
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#171d16",
                        "on-secondary-fixed": "#00210c",
                        "surface-container-highest": "#30372f",
                        "tertiary": "#ffb2bf",
                        "surface": "#0e150f",
                        "on-secondary-fixed-variant": "#005227",
                        "surface-tint": "#62df7d",
                        "on-tertiary-fixed": "#3f0016",
                        "tertiary-fixed-dim": "#ffb2bf",
                        "on-error": "#690005",
                        "navy-deep": "#050913",
                        "navy-glass": "rgba(14, 20, 36, 0.85)",
                        "sky-blue": "#0EA5E9",
                        "emerald-accent": "#22C55E"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "unit": "4px",
                        "margin-mobile": "20px",
                        "container-max": "1440px",
                        "margin-desktop": "64px",
                        "gutter": "24px"
                    },
                    fontFamily: {
                        "body-sm": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "display-hero": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"]
                    },
                    fontSize: {
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .backdrop-blur-custom { backdrop-filter: blur(40px); }
        .glass-border { border: 1.5px solid rgba(255,255,255,0.06); }
        .white-rim { box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.04), 0 20px 40px rgba(0,0,0,0.5); }
        .input-glass { background: rgba(5, 5, 10, 0.4); border: 1.5px solid rgba(255,255,255,0.12); }
        .dashed-box { border: 1px dashed rgba(255,255,255,0.15); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-navy-deep font-body-md text-on-surface min-h-screen flex items-center justify-center p-6">
<!-- Background Decoration -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[40%] h-[40%] rounded-full bg-sky-blue/5 blur-[120px]"></div>
</div>
<!-- Main Dialog Container -->
<div class="relative w-full max-w-[640px] bg-navy-glass rounded-[16px] glass-border white-rim backdrop-blur-custom p-8 overflow-hidden">
<!-- Header Section -->
<header class="flex items-start justify-between mb-8">
<div class="flex items-center gap-5">
<div class="w-9 h-9 rounded-full bg-sky-blue/10 flex items-center justify-center border border-sky-blue/20">
<span class="material-symbols-outlined text-sky-blue text-[20px]" data-icon="home">home</span>
</div>
<div>
<span class="block text-[11px] font-semibold tracking-wider text-sky-blue uppercase mb-1">Investment Property</span>
<h1 class="font-headline-md text-headline-md text-[#FAFAF7] leading-tight">Add property</h1>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Form Content -->
<div class="space-y-8">
<!-- Input Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-[12px] font-medium text-slate-400 px-1">Property name</label>
<input class="w-full bg-navy-deep/50 input-glass rounded-[12px] px-4 py-3 text-[#FAFAF7] placeholder-on-surface-variant/30 focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="e.g. Bondi Beach Apartment" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-[12px] font-medium text-slate-400 px-1">Current value</label>
<input class="w-full bg-navy-deep/50 input-glass rounded-[12px] px-4 py-3 text-[#FAFAF7] placeholder-on-surface-variant/30 focus:ring-1 focus:ring-primary outline-none transition-all text-right" placeholder="$0.00" type="text"/>
</div>
<div class="col-span-2 space-y-2">
<label class="block text-[12px] font-medium text-slate-400 px-1">Address</label>
<input class="w-full bg-navy-deep/50 input-glass rounded-[12px] px-4 py-3 text-[#FAFAF7] placeholder-on-surface-variant/30 focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Start typing address..." type="text"/>
</div>
</div>
<!-- Ownership Section -->
<div class="space-y-4">
<h3 class="text-[14px] font-medium text-[#FAFAF7] opacity-90 px-1">Who owns this?</h3>
<div class="grid grid-cols-2 gap-3">
<!-- Selected Card -->
<button class="relative text-left p-4 rounded-[12px] border-[1.5px] border-emerald-accent bg-emerald-accent/10 transition-all group">
<div class="absolute top-3 right-3 text-emerald-accent">
<span class="material-symbols-outlined text-[18px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="text-[#FAFAF7] font-semibold text-body-sm mb-1">Just me</div>
<div class="text-[#94A3B8] text-[12px]">In your own name</div>
</button>
<!-- Unselected Cards -->
<button class="relative text-left p-4 rounded-[12px] border-[1.5px] border-white/10 hover:bg-white/5 transition-all group">
<div class="text-[#FAFAF7] font-medium text-body-sm mb-1">Joint — with someone</div>
<div class="text-[#94A3B8] text-[12px]">Equal shares, survivorship</div>
</button>
<button class="relative text-left p-4 rounded-[12px] border-[1.5px] border-white/10 hover:bg-white/5 transition-all group">
<div class="text-[#FAFAF7] font-medium text-body-sm mb-1">Shared — set percentages</div>
<div class="text-[#94A3B8] text-[12px]">Fixed splits, e.g. 70/30</div>
</button>
<button class="relative text-left p-4 rounded-[12px] border-[1.5px] border-white/10 hover:bg-white/5 transition-all group">
<div class="text-[#FAFAF7] font-medium text-body-sm mb-1">An entity</div>
<div class="text-[#94A3B8] text-[12px]">A trust, company or SMSF</div>
</button>
</div>
<!-- Person Chips -->
<div class="flex flex-wrap gap-2 pt-1">
<div class="flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-3 py-1.5 transition-all cursor-default">
<div class="w-5 h-5 rounded-full bg-primary/20 flex items-center justify-center text-[10px] font-bold text-primary">N</div>
<span class="text-body-sm text-[#FAFAF7]">Newsha</span>
</div>
<button class="flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-full px-3 py-1.5 hover:bg-white/10 transition-all">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant" data-icon="add">add</span>
<span class="text-body-sm text-[#FAFAF7]">Someone new</span>
</button>
</div>
</div>
<!-- Hint Box -->
<div class="dashed-box rounded-[12px] p-4 bg-white/[0.02]">
<div class="flex gap-3">
<span class="material-symbols-outlined text-slate-400 text-[18px]" data-icon="info">info</span>
<p class="text-[11px] leading-relaxed text-slate-400">
                        Purchased through a trust or company? Add it in <a class="text-sky-blue hover:underline" href="#">My Structure</a> first
                    </p>
</div>
</div>
</div>
<!-- Footer Actions -->
<footer class="mt-10 flex flex-col items-stretch gap-3">
<button class="w-full bg-emerald-accent hover:bg-emerald-accent/90 text-white font-semibold rounded-[12px] py-4 transition-all shadow-[0_10px_30px_rgba(34,197,94,0.2)] active:scale-[0.98]">
                Add property
            </button>
<button class="w-full text-on-surface-variant hover:text-[#FAFAF7] font-medium text-body-sm py-2 transition-colors">
                Cancel
            </button>
</footer>
</div>
<script>
        // Simple logic for card selection styling toggle
        document.querySelectorAll('button[class*="relative text-left"]').forEach(button => {
            button.addEventListener('click', function() {
                // Clear others
                document.querySelectorAll('button[class*="relative text-left"]').forEach(btn => {
                    btn.classList.remove('border-emerald-accent', 'bg-emerald-accent/10');
                    btn.classList.add('border-white/10');
                    const icon = btn.querySelector('.text-emerald-accent');
                    if(icon) icon.remove();
                });
                // Set active
                this.classList.add('border-emerald-accent', 'bg-emerald-accent/10');
                this.classList.remove('border-white/10');
                
                const checkIcon = document.createElement('div');
                checkIcon.className = 'absolute top-3 right-3 text-emerald-accent';
                checkIcon.innerHTML = '<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: \'FILL\' 1;">check_circle</span>';
                this.appendChild(checkIcon);
            });
        });
    </script>
</body></html>
