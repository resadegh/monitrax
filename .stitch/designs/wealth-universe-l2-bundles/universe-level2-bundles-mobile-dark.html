<style>
        body {
            background-color: #050913;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .mesh-glow {
            background: radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.15) 0%, rgba(79, 70, 229, 0.05) 50%, transparent 100%);

        }
        .glass-card {
            background: rgba(27, 33, 26, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .filament {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, rgba(98, 223, 125, 0) 0%, rgba(98, 223, 125, 0.4) 50%, rgba(98, 223, 125, 0) 100%);
            transform-origin: left center;
            pointer-events: none;
        }
        .tabular { font-variant-numeric: tabular-nums; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }

<body class="text-on-surface select-none">
<!-- Background Layer -->
<div class="fixed inset-0 z-0">

<div class="mesh-glow absolute bottom-[-10%] left-1/2 -translate-x-1/2 w-[800px] h-[600px]"></div>
</div>
<!-- UI Overlay: Top Navigation -->
<nav class="fixed top-8 left-8 z-50 flex items-center gap-3">
<button class="glass-card px-4 py-2 rounded-full flex items-center gap-2 hover:bg-white/10 transition-all active:scale-95 group">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant group-hover:text-primary" data-icon="chevron_left">chevron_left</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">UNIVERSE</span>
</button>
<div class="glass-card px-4 py-2 rounded-full opacity-50">
<span class="font-label-caps text-label-caps text-on-surface">REZA</span>
</div>
</nav>
<!-- Main Content: Graph Area -->
<main class="relative h-screen w-full flex flex-col items-center justify-center p-container-padding-mobile md:p-margin-desktop overflow-hidden">
<!-- Connections Layer -->
<div class="absolute inset-0 z-10 overflow-hidden pointer-events-none" id="filament-container"></div>
<!-- Orbiting Bundle Tiles -->
<div class="relative z-20 w-full max-w-[1000px] h-[400px] flex justify-between items-end mb-32">
<!-- Properties -->
<div class="bundle-tile group animate-float" style="animation-delay: 0s;">
<div class="glass-card w-[160px] p-4 rounded-[16px] relative overflow-hidden transition-transform duration-300 hover:scale-105">
<div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-sky-400 to-indigo-500"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 to-indigo-600 flex items-center justify-center shadow-[0_0_15px_rgba(56,189,248,0.4)]">
<span class="material-symbols-outlined text-white text-[20px]" data-icon="home">home</span>
</div>
<div class="text-center">
<p class="font-label-caps text-[10px] text-on-surface-variant uppercase tracking-widest">6 ENTITIES</p>
<h3 class="font-headline-md text-[18px] text-on-surface">Properties</h3>
</div>
<p class="tabular font-body-md text-sky-400 font-bold">$4.0M</p>
</div>
</div>
</div>
<!-- Loans -->
<div class="bundle-tile group animate-float" style="animation-delay: 0.5s;">
<div class="glass-card w-[160px] p-4 rounded-[16px] relative overflow-hidden transition-transform duration-300 hover:scale-105">
<div class="absolute top-0 left-0 w-full h-[3px] bg-amber-500"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center shadow-[0_0_15px_rgba(245,158,11,0.4)]">
<span class="material-symbols-outlined text-white text-[20px]" data-icon="payments">payments</span>
</div>
<div class="text-center">
<p class="font-label-caps text-[10px] text-on-surface-variant uppercase tracking-widest">5 ENTITIES</p>
<h3 class="font-headline-md text-[18px] text-on-surface">Loans</h3>
</div>
<p class="tabular font-body-md text-amber-500 font-bold">$2.0M owing</p>
</div>
</div>
</div>
<!-- Vehicles -->
<div class="bundle-tile group animate-float" style="animation-delay: 1s;">
<div class="glass-card w-[160px] p-4 rounded-[16px] relative overflow-hidden transition-transform duration-300 hover:scale-105">
<div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-teal-400 to-cyan-500"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-teal-400 to-cyan-600 flex items-center justify-center shadow-[0_0_15px_rgba(45,212,191,0.4)]">
<span class="material-symbols-outlined text-white text-[20px]" data-icon="directions_car">directions_car</span>
</div>
<div class="text-center">

<h3 class="font-headline-md text-[18px] text-on-surface">Vehicles</h3>

<div class="relative z-30 flex flex-col items-center gap-4" id="central-entity">
<div class="w-24 h-24 glass-card rounded-full p-1 border-sky-400/50 shadow-[0_0_40px_rgba(56,189,248,0.2)] flex items-center justify-center active:scale-90 transition-transform">

</div>
</div>

</main>
<!-- Draggable Bottom Sheet Handle -->
<footer class="fixed bottom-0 left-0 w-full z-50">
<div class="h-16 w-full bg-surface-container/60 backdrop-blur-xl border-t border-white/5 rounded-t-[32px] flex items-start justify-center pt-3 cursor-grab active:cursor-grabbing">
<div class="w-12 h-1.5 bg-on-surface-variant/30 rounded-full"></div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('filament-container');
            const central = document.getElementById('central-entity');
            const bundles = document.querySelectorAll('.bundle-tile');

            function drawFilaments() {
                container.innerHTML = '';
                const cRect = central.getBoundingClientRect();
                const cX = cRect.left + cRect.width / 2;
                const cY = cRect.top + cRect.height / 2;

                bundles.forEach(bundle => {
                    const bRect = bundle.getBoundingClientRect();
                    const bX = bRect.left + bRect.width / 2;
                    const bY = bRect.top + bRect.height / 2;

                    const length = Math.sqrt(Math.pow(bX - cX, 2) + Math.pow(bY - cY, 2));
                    const angle = Math.atan2(bY - cY, bX - cX) * 180 / Math.PI;

                    const filament = document.createElement('div');
                    filament.className = 'filament';
                    filament.style.width = `${length}px`;
                    filament.style.left = `${cX}px`;
                    filament.style.top = `${cY}px`;
                    filament.style.transform = `rotate(${angle}deg)`;
                    
                    container.appendChild(filament);
                });
            }

            // Initial draw
            drawFilaments();

            // Redraw on window resize
            window.addEventListener('resize', drawFilaments);

            // Re-draw on animation frames to keep linked to floating elements
            function animate() {
                drawFilaments();
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        });
    </script>
</footer>
