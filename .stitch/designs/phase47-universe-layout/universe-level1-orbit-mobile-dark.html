<style>
        body {
            background-color: #050913;
            overflow: hidden; /* Prevent scrolling for the orbit feel */
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(19, 26, 46, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .orbit-container {
            position: relative;
            width: 390px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .entity-node {
            position: absolute;
            width: 96px;
            height: 96px;
            border-radius: 24px; /* Squircle approximation */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8px;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            z-index: 20;
        }

        .entity-node:active {
            transform: scale(0.92);
        }

        .center-anchor {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #c0c1ff 0%, #494bd6 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(192, 193, 255, 0.4);
            z-index: 30;
            position: relative;
        }

        .ribbon-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .dust-mote {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
        }

        @keyframes drift {
            from { transform: translateY(0px) translateX(0px); }
            to { transform: translateY(-100px) translateX(20px); }
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        .glow-emerald { box-shadow: 0 0 20px rgba(78, 222, 163, 0.15); border: 1px solid rgba(78, 222, 163, 0.3); }
        .glow-sky { box-shadow: 0 0 20px rgba(137, 206, 255, 0.15); border: 1px solid rgba(137, 206, 255, 0.3); }
        .glow-lavender { box-shadow: 0 0 20px rgba(192, 193, 255, 0.15); border: 1px solid rgba(192, 193, 255, 0.3); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface select-none overflow-hidden">
<!-- Background Space Dust -->
<div class="fixed inset-0 pointer-events-none" id="space-void"></div>
<!-- UI Chrome: Top Search & Filters -->
<div class="fixed top-0 left-0 w-full z-50 pt-safe-area px-container-padding flex flex-col gap-4 bg-gradient-to-b from-background to-transparent pb-8">
<div class="flex items-center gap-3 glass-panel rounded-full px-4 h-12">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
<input class="bg-transparent border-none focus:ring-0 text-body-lg w-full text-on-surface placeholder:text-on-surface-variant/50" placeholder="Search Universe..." type="text"/>
<span class="material-symbols-outlined text-on-surface-variant">mic</span>
</div>
<div class="flex overflow-x-auto gap-2 no-scrollbar pb-1">
<button class="bg-primary text-on-primary px-5 py-1.5 rounded-full font-label-caps whitespace-nowrap">All</button>
<button class="glass-panel text-on-surface-variant px-5 py-1.5 rounded-full font-label-caps whitespace-nowrap">People</button>
<button class="glass-panel text-on-surface-variant px-5 py-1.5 rounded-full font-label-caps whitespace-nowrap">Trusts</button>
<button class="glass-panel text-on-surface-variant px-5 py-1.5 rounded-full font-label-caps whitespace-nowrap">SMSF</button>
<button class="glass-panel text-on-surface-variant px-5 py-1.5 rounded-full font-label-caps whitespace-nowrap">Companies</button>
</div>
<div class="flex justify-center items-center gap-2">
<span class="text-on-surface-variant font-label-caps tracking-widest text-[10px] flex items-center gap-1 opacity-60">
<span class="material-symbols-outlined text-[14px]">chevron_left</span>
                LEVEL 1 · UNIVERSE
            </span>
</div>
</div>
<!-- Main Orbit Scene -->
<div class="orbit-container" id="orbit-root">
<!-- SVG Connections -->
<svg class="ribbon-svg" id="connections-layer"></svg>
<!-- Center Node (User) -->
<div class="center-anchor" id="user-anchor">
<span class="font-headline-md text-on-primary">YOU</span>
<!-- Inner Ring Decor -->
<div class="absolute inset-0 border-2 border-white/20 rounded-full scale-125"></div>
</div>
<!-- Orbiting Entities (Generated via JS for precise geometry) -->
<div class="contents" id="entities-layer"></div>
</div>
<!-- UI Chrome: Footer Hint & Total Net Assets -->
<div class="fixed bottom-24 left-0 w-full px-container-padding flex flex-col items-center gap-6">
<p class="text-on-surface-variant font-label-caps text-[10px] opacity-40 animate-pulse">
            Tap an entity to open its constellation
        </p>
</div>
<!-- Net Assets Widget (Floating Bottom Right) -->
<div class="fixed bottom-24 right-6 glass-panel p-4 rounded-2xl flex flex-col gap-1 glow-lavender z-50">
<span class="font-label-caps text-[10px] text-on-surface-variant">NET ASSETS</span>
<span class="font-number-xl text-primary tabular-nums">$14.2M</span>
<div class="flex items-center gap-1 text-tertiary">
<span class="material-symbols-outlined text-[16px]">trending_up</span>
<span class="font-number-sm">+1.2%</span>
</div>
</div>
<!-- Bottom Navigation (Shared Component Style) -->
<nav class="fixed bottom-0 left-0 w-full z-50 rounded-t-3xl glass-panel border-t-0 shadow-2xl h-20 px-8 flex justify-between items-center">
<div class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">grain</span>
<span class="font-label-caps text-[10px]">CONSTELLATION</span>
</div>
<div class="flex flex-col items-center gap-1 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined">info</span>
<span class="font-label-caps text-[10px]">LEGEND</span>
</div>
<div class="flex flex-col items-center gap-1 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined">calendar_today</span>
<span class="font-label-caps text-[10px]">FISCAL YEAR</span>
</div>
<div class="flex flex-col items-center gap-1 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined">history</span>
<span class="font-label-caps text-[10px]">HISTORY</span>
</div>
</nav>
<script>
        const entities = [
            { name: 'Renew Investment', sub: 'Fund', val: '$4.2M', color: 'glow-emerald', type: 'fund' },
            { name: 'Renew Unit', sub: 'Trust', val: '$1.1M', color: 'glow-sky', type: 'trust' },
            { name: 'Renew', sub: 'Super', val: '$847k', color: 'glow-emerald', type: 'smsf' },
            { name: 'Renew Group', sub: 'Holdings', val: '$2.8M', color: 'glow-lavender', type: 'company' },
            { name: 'Property', sub: 'Portfolio', val: '$3.5M', color: 'glow-sky', type: 'asset' },
            { name: 'Digital', sub: 'Assets', val: '$1.2M', color: 'glow-emerald', type: 'asset' },
            { name: 'Family', sub: 'Trust', val: '$540k', color: 'glow-lavender', type: 'trust' }
        ];

        const orbitRoot = document.getElementById('entities-layer');
        const connectionsLayer = document.getElementById('connections-layer');
        const centerX = 195; // 390 / 2
        const centerY = window.innerHeight / 2;
        const radius = 135;

        // Space Dust Gen
        const spaceVoid = document.getElementById('space-void');
        for (let i = 0; i < 40; i++) {
            const mote = document.createElement('div');
            mote.className = 'dust-mote';
            mote.style.left = `${Math.random() * 100}%`;
            mote.style.top = `${Math.random() * 100}%`;
            const size = Math.random() * 3 + 1;
            mote.style.width = `${size}px`;
            mote.style.height = `${size}px`;
            mote.style.animation = `drift ${Math.random() * 20 + 20}s infinite linear`;
            spaceVoid.appendChild(mote);
        }

        // Render Entities and Connections
        entities.forEach((entity, i) => {
            const angle = (i / entities.length) * (Math.PI * 2) - (Math.PI / 2);
            const x = centerX + Math.cos(angle) * radius;
            const y = centerY + Math.sin(angle) * radius;

            // Create Node
            const node = document.createElement('div');
            node.className = `entity-node glass-panel ${entity.color}`;
            node.style.left = `${x - 48}px`;
            node.style.top = `${y - 48}px`;
            node.innerHTML = `
                <div class="font-label-caps text-[9px] text-on-surface-variant leading-tight">${entity.name}</div>
                <div class="font-label-caps text-[9px] text-on-surface-variant opacity-60 mb-1">${entity.sub}</div>
                <div class="font-number-sm tabular-nums text-on-surface font-bold">${entity.val}</div>
            `;
            orbitRoot.appendChild(node);

            // Create Connection Ribbon
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // Drawing Bezier from center to node
            const d = `M ${centerX} ${centerY} L ${x} ${y}`;
            path.setAttribute("d", d);
            path.setAttribute("stroke", "rgba(192, 193, 255, 0.2)");
            path.setAttribute("stroke-width", "1");
            path.setAttribute("fill", "none");
            connectionsLayer.appendChild(path);

            // Add interaction
            node.addEventListener('mouseenter', () => {
                path.setAttribute("stroke", "rgba(192, 193, 255, 0.8)");
                path.setAttribute("stroke-width", "2");
                node.style.transform = 'scale(1.15)';
            });
            node.addEventListener('mouseleave', () => {
                path.setAttribute("stroke", "rgba(192, 193, 255, 0.2)");
                path.setAttribute("stroke-width", "1");
                node.style.transform = 'scale(1)';
            });
        });

        // Soft floating animation for the center anchor
        let tick = 0;
        function animate() {
            tick += 0.02;
            const floatY = Math.sin(tick) * 5;
            document.getElementById('user-anchor').style.transform = `translateY(${floatY}px)`;
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body></html>
