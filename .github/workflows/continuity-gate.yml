name: Continuity Gate

# Write rail of the Monitrax continuity system: a PR that changes substantive
# workstream files must also update STATE.md AND the implementation plan
# (docs/IMPLEMENTATION_PLAN.md hub or a docs/implementation/ spoke) in the same
# PR. SOFT-LAUNCH: warns only. To ARM later: change ::warning:: to
# ::error:: and the final `exit 0` to `exit 1`, then add as a required check.

on:
  pull_request:
    branches: [main, master]

jobs:
  state-sync:
    name: STATE / plan write-back check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require STATE + plan write-back when workstream files change
        # PR title/body + SHAs are passed via env (NOT inline ${{ }} into the
        # script) so arbitrary Markdown in the PR body — parens, backticks,
        # pipes — can never break the shell parse. (Fixes the 2026-06-15
        # `syntax error near unexpected token` crash on PR #1108.)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"; echo "$changed"
          if printf '%s %s' "$PR_TITLE" "$PR_BODY" \
               | grep -q '\[skip-state\]'; then
            echo "Bypass [skip-state] present — gate skipped."; exit 0
          fi
          # docs/implementation/05_MOBILE_WORKSTREAM.md is watched explicitly: the
          # mobile companion live tracker must keep STATE.md + the plan in lock-step
          # (registered 2026-06-19, workstream 0·MOB). Additive — does not change the
          # existing path set.
          substantive="$(echo "$changed" \
            | grep -E '^(app/|lib/|components/|contexts/|hooks/|prisma/|mobile-app/|docs/(marketing|architecture|compliance)/|docs/implementation/05_MOBILE_WORKSTREAM\.md)' \
            || true)"
          if [ -z "$substantive" ]; then
            echo "No substantive workstream files changed — gate not required."; exit 0
          fi
          # The plan is a hub + spokes (docs/implementation/*) since 2026-06-15 (F-8) —
          # a workstream update touches a spoke (or the hub), so accept either.
          if echo "$changed" | grep -qx 'STATE.md' \
             && echo "$changed" | grep -qE '^docs/(IMPLEMENTATION_PLAN\.md|implementation/)'; then
            echo "STATE.md and the implementation plan (hub or a docs/implementation/ spoke) both updated."; exit 0
          fi
          echo "::warning::PR changes workstream files but does not update BOTH STATE.md and the implementation plan (docs/IMPLEMENTATION_PLAN.md or a docs/implementation/ spoke). Update them, or add [skip-state] if trivial. (Soft-launch — will become blocking once armed.)"
          exit 0
