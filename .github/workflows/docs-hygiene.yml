name: Docs Hygiene

# Continuity Phase 2, finding F-1: two doc-drift guards.
#   (a) plan freshness  — the IMPLEMENTATION_PLAN hub's "Last updated" date
#       must not fall behind the newest Recently-Completed entry.
#   (b) index coverage  — every in-scope doc under docs/ must be referenced
#       in docs/00_INDEX.md.
#
#   (c) MON-131 ledger freshness — a diff touching a MON-131 surface must
#       touch docs/implementation/MON-131_TRANCHE_LEDGER.md too.
#
# SOFT-LAUNCH applies to (a) and (b) ONLY: they run without --strict, emitting
# ::warning:: and exiting 0. To ARM them: add --strict to those two run steps.
#
# (c) RUNS --strict DELIBERATELY (Reza directive 2026-07-31: "document all
# changes for MON-131 and keep it updated"). A warn-only ledger gate does not
# keep anything updated — it is the failure mode CLAUDE.md §20.6 named, where
# the rule exists and nothing checks it. The step therefore FAILS the job.
#
# NOTE, so this is not over-read: this workflow is not yet a REQUIRED status
# check, so a failure here is loud but does not itself block merge. Making it
# required depends on the GitHub `workflow` scope being granted (same blocker
# as continuity-gate.yml — see STATE.md / §0·CONT).

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'STATE.md'
      - 'SYSTEM_MAP.md'
      - 'scripts/check-plan-freshness.sh'
      - 'scripts/check-index-paths.sh'
      - 'scripts/check-mon131-ledger.mjs'
      - 'lib/income/banked/**'
      - 'lib/matrix/**'
      - '.audit/**'
      - '.github/workflows/docs-hygiene.yml'

jobs:
  docs-hygiene:
    name: Plan freshness + index coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan freshness (F-1a)
        run: bash scripts/check-plan-freshness.sh
      - name: Index coverage (F-1b)
        run: bash scripts/check-index-paths.sh
      - name: MON-131 ledger freshness
        run: node scripts/check-mon131-ledger.mjs --strict --base=origin/${{ github.base_ref }}
