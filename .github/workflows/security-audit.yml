name: Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Informational: surfaces ALL high+critical advisories, including
      # devDependencies (e.g. vitest/vite test tooling). Non-blocking so the
      # team stays aware without gating deploys on dev-only or no-fix-available
      # advisories (xlsx/SheetJS, etc.). Tracked in IMPLEMENTATION_PLAN #28.
      - name: Run npm audit (all deps — informational)
        run: npm audit --audit-level=high
        continue-on-error: true

      # BLOCKING gate: production runtime only. A critical in a devDependency
      # (test runner, linter, build tool) never ships to users, so it must not
      # block a deploy. `--omit=dev` scopes the must-pass gate to what actually
      # runs in production. (2026-06-02: the only criticals were vitest's
      # Vitest-UI-server advisory — dev-only, and @vitest/ui isn't even
      # installed here. See docs/policy/APPROVED_DEPENDENCIES.md.)
      - name: Run npm audit (production deps, critical — must pass)
        run: npm audit --omit=dev --audit-level=critical

  build-check:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run build
        run: npm run build
        env:
          # Required env vars for build (non-sensitive placeholders)
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          NEXT_PUBLIC_FIREBASE_API_KEY: "placeholder"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "placeholder"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "placeholder"
